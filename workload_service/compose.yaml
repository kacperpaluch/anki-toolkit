# Wszystkie ustawienia (konto Anki, talie, budżet, e-mail) edytujesz w panelu.
services:
  workload:
    build: .
    image: anki-workload:local
    restart: unless-stopped
    environment: &workload_environment
      TZ: Europe/Warsaw
    volumes:
      - ../user_files:/data/user_files
  dashboard:
    image: anki-workload:local
    command: dashboard
    environment: *workload_environment
    restart: unless-stopped
    ports:
      - '8070:8080' # panel w sieci lokalnej, bez logowania
    volumes:
      - ../user_files:/data/user_files
